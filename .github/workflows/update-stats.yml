# ARCHIVED - CDC2025
# Conservé comme référence pour le futur système de statistiques live.

name: Update CDC2025 Live Stats [ARCHIVED]

on:
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Update live stats
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python update_stats_twitch.py

      - name: 📤 Commit changes if needed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add out/live_stats.json
          git diff --staged --quiet || git commit -m "🔄 Update live stats (manual)"
          git push
